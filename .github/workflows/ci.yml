name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Validar HTML5 y semántica
        run: npm run test:html
      - name: Verificar enlaces externos seguros
        run: npm run test:links
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Ejecutar pruebas de accesibilidad, formulario y responsive
        run: npm test